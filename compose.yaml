name: excalidraw

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["ssl"]
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ${CERTS_DIR:-./certs}
        target: /etc/letsencrypt
        bind:
          create_host_path: false
      - certbot-work:/var/lib/letsencrypt
      - certbot-logs:/var/log/letsencrypt
    command:
      - certonly
      - --standalone
      - --preferred-challenges
      - http
      - --non-interactive
      - --agree-tos
      - --keep-until-expiring
      - --email
      - ${SSL_EMAIL:-}
      - --cert-name
      - ${DOMAIN:?Set DOMAIN in .env}
      - -d
      - ${DOMAIN:?Set DOMAIN in .env}
    networks:
      - proxy

  nginx:
    <<: *service-defaults
    image: nginx:1.30.4-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-privkey.pem}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|TLS_CERT_FILE|TLS_KEY_FILE)$$"
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERTS_DIR:-./certs}
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      excalidraw:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy

  excalidraw:
    <<: *service-defaults
    image: zimengxiong/excalidash-frontend:0.6.0
    environment:
      BACKEND_URL: "backend:18474"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy

  backend:
    <<: *service-defaults
    image: zimengxiong/excalidash-backend:0.6.0
    init: true
    environment:
      PORT: "18474"
      NODE_ENV: "production"
      DATABASE_PROVIDER: "sqlite"
      DATABASE_URL: "file:/app/prisma/dev.db"
      AUTH_MODE: "local"
      DISABLE_ONBOARDING_GATE: "false"
      FRONTEND_URL: "https://${DOMAIN:?Set DOMAIN in .env}"
      TRUST_PROXY: "1"
      ENFORCE_HTTPS_REDIRECT: "false"
      BODY_LIMIT_MB: "50"
      FILE_UPLOAD_MAX_MB: "50"
      JWT_SECRET: ${JWT_SECRET:-}
      CSRF_SECRET: ${CSRF_SECRET:-}
      API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER:?Set API_KEY_HASH_PEPPER in .env}
    volumes:
      - ./data/excalidash:/app/prisma
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18474/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  certbot-work:
  certbot-logs:
