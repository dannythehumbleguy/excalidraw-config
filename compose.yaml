name: excalidraw

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["ssl"]
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ${CERTS_DIR:-./certs}
        target: /etc/letsencrypt
        bind:
          create_host_path: false
      - certbot-work:/var/lib/letsencrypt
      - certbot-logs:/var/log/letsencrypt
    command:
      - certonly
      - --standalone
      - --preferred-challenges
      - http
      - --non-interactive
      - --agree-tos
      - --keep-until-expiring
      - --email
      - ${SSL_EMAIL:-}
      - --cert-name
      - ${DOMAIN:?Set DOMAIN in .env}
      - -d
      - ${DOMAIN:?Set DOMAIN in .env}
    networks:
      - proxy

  nginx:
    <<: *service-defaults
    image: nginx:1.30.4-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-privkey.pem}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|TLS_CERT_FILE|TLS_KEY_FILE)$$"
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERTS_DIR:-./certs}
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      excalidraw:
        condition: service_healthy
      storage:
        condition: service_healthy
      room:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy

  excalidraw:
    <<: *service-defaults
    image: alswl/excalidraw:v0.18.1-fork-b2
    environment:
      VITE_APP_BACKEND_V2_GET_URL: "https://${DOMAIN:?Set DOMAIN in .env}/storage/api/v2/scenes/"
      VITE_APP_BACKEND_V2_POST_URL: "https://${DOMAIN:?Set DOMAIN in .env}/storage/api/v2/scenes/"
      VITE_APP_WS_SERVER_URL: "https://${DOMAIN:?Set DOMAIN in .env}"
      VITE_APP_HTTP_STORAGE_BACKEND_URL: "https://${DOMAIN:?Set DOMAIN in .env}/storage/api/v2"
      VITE_APP_STORAGE_BACKEND: "http"
      VITE_APP_FIREBASE_CONFIG: "{}"
      VITE_APP_DISABLE_TRACKING: "true"
      VITE_APP_DISABLE_SENTRY: "true"
      VITE_APP_AI_BACKEND: ""
      PUBLIC_URL: "https://${DOMAIN:?Set DOMAIN in .env}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy

  storage:
    <<: *service-defaults
    image: ghcr.io/kitsteam/excalidraw-storage-backend:v0.2.3
    environment:
      PORT: "18474"
      GLOBAL_PREFIX: "/api/v2"
      STORAGE_URI: "postgresql://excalidraw:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/excalidraw"
      LOG_LEVEL: "warn"
      BODY_LIMIT: "50mb"
      ENABLE_POSTGRES_TTL_SERVICE: "false"
      ENABLE_POSTGRES_TOUCH: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18474/api/v2/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - proxy
      - database

  room:
    <<: *service-defaults
    image: ghcr.io/kitsteam/excalidraw-room:v0.2.3
    environment:
      PORT: "18475"
      CORS_ORIGIN: "https://${DOMAIN:?Set DOMAIN in .env}"
      BASE_PATH: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18475/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy

  postgres:
    <<: *service-defaults
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: excalidraw
      POSTGRES_USER: excalidraw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 uses a versioned PGDATA beneath /var/lib/postgresql.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "excalidraw", "-d", "excalidraw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - database

networks:
  proxy:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  certbot-work:
  certbot-logs:
